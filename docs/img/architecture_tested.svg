<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#24292f">Reference rig — what was actually run (2 lanes)</text>

  <!-- dryer + spools -->
  <rect x="20" y="70" width="150" height="200" rx="10" fill="#f6f8fa" stroke="#8b949e" stroke-dasharray="6 4"/>
  <text x="95" y="92" font-size="12" fill="#57606a" text-anchor="middle">Filament dryer</text>
  <text x="95" y="106" font-size="10" fill="#8b949e" text-anchor="middle">(external feed, technical filaments)</text>
  <circle cx="65" cy="150" r="26" fill="#fff" stroke="#57606a" stroke-width="2"/>
  <circle cx="65" cy="150" r="8" fill="#d0d7de"/>
  <text x="65" y="196" font-size="10" fill="#57606a" text-anchor="middle">spool 1</text>
  <circle cx="125" cy="222" r="26" fill="#fff" stroke="#57606a" stroke-width="2"/>
  <circle cx="125" cy="222" r="8" fill="#d0d7de"/>
  <text x="125" y="268" font-size="10" fill="#57606a" text-anchor="middle">spool 2</text>

  <!-- LLL lanes -->
  <rect x="230" y="95" width="170" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="315" y="118" font-size="13" font-weight="bold" fill="#0969da" text-anchor="middle">LLL Plus — lane 1</text>
  <text x="315" y="136" font-size="10" fill="#24292f" text-anchor="middle">smart buffer · tension arm (3 halls)</text>
  <text x="315" y="151" font-size="10" fill="#24292f" text-anchor="middle">entrance sensor · USB MCU</text>
  <text x="315" y="167" font-size="10" fill="#0969da" text-anchor="middle">role: active | parked | standby</text>

  <rect x="230" y="205" width="170" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="315" y="228" font-size="13" font-weight="bold" fill="#0969da" text-anchor="middle">LLL Plus — lane 2</text>
  <text x="315" y="246" font-size="10" fill="#24292f" text-anchor="middle">smart buffer · tension arm (3 halls)</text>
  <text x="315" y="261" font-size="10" fill="#24292f" text-anchor="middle">entrance sensor · USB MCU</text>
  <text x="315" y="277" font-size="10" fill="#0969da" text-anchor="middle">a parked lane never pushes</text>

  <text x="315" y="300" font-size="10" fill="#8b949e" text-anchor="middle">…lane N (N-scalable: one [mcu]+[lll_buffer] per board)</text>

  <!-- splitter -->
  <path d="M470,135 L520,175 L520,205 L470,245 Z" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="497" y="165" font-size="11" font-weight="bold" fill="#9a6700" text-anchor="middle">Y</text>
  <text x="495" y="285" font-size="11" fill="#9a6700" text-anchor="middle">passive splitter</text>
  <text x="495" y="299" font-size="10" fill="#8b949e" text-anchor="middle">N inputs → 1 output</text>

  <!-- SFS -->
  <rect x="580" y="160" width="120" height="60" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="640" y="183" font-size="12" font-weight="bold" fill="#cf222e" text-anchor="middle">SFS (post-Y)</text>
  <text x="640" y="199" font-size="10" fill="#24292f" text-anchor="middle">presence + motion pulses</text>
  <text x="640" y="212" font-size="10" fill="#24292f" text-anchor="middle">on a USB MCU (RP2040)</text>

  <!-- orbiter + toolhead -->
  <rect x="760" y="150" width="190" height="80" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="855" y="173" font-size="12" font-weight="bold" fill="#1a7f37" text-anchor="middle">Toolhead (direct drive)</text>
  <text x="855" y="190" font-size="10" fill="#24292f" text-anchor="middle">extruder-entry presence sensor</text>
  <text x="855" y="204" font-size="10" fill="#24292f" text-anchor="middle">(Smart Orbiter) → validates arrival</text>
  <text x="855" y="219" font-size="10" fill="#24292f" text-anchor="middle">single hotend, no selector</text>

  <!-- flow arrows -->
  <line x1="93" y1="150" x2="228" y2="132" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="152" y1="222" x2="228" y2="240" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="402" y1="135" x2="468" y2="160" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="402" y1="245" x2="468" y2="220" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="522" y1="190" x2="578" y2="190" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="702" y1="190" x2="758" y2="190" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- measured distance -->
  <path d="M522,235 C560,258 610,258 700,240" fill="none" stroke="#8250df" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="612" y="272" font-size="11" font-weight="bold" fill="#8250df" text-anchor="middle">D = measured sensor ↔ splitter-exit distance</text>
  <text x="612" y="287" font-size="10" fill="#8250df" text-anchor="middle">the single number that makes unload deterministic (tail = D + margin)</text>

  <!-- host -->
  <rect x="330" y="330" width="320" height="44" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.4"/>
  <text x="490" y="349" font-size="12" font-weight="bold" fill="#24292f" text-anchor="middle">Klipper host — orchestrates lane roles over USB</text>
  <text x="490" y="365" font-size="10" fill="#57606a" text-anchor="middle">[lll_buffer] extra · SET_ACTIVE_LANE · events · dashboard in Mainsail</text>
  <line x1="315" y1="287" x2="420" y2="328" stroke="#8b949e" stroke-width="1.1" stroke-dasharray="3 3"/>
  <line x1="640" y1="222" x2="560" y2="328" stroke="#8b949e" stroke-width="1.1" stroke-dasharray="3 3"/>
  <line x1="855" y1="232" x2="640" y2="336" stroke="#8b949e" stroke-width="1.1" stroke-dasharray="3 3"/>
</svg>
